---

{{ if and (eq .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_5_5 }}
    {{ if eq .Vars.win25cis_system_role "domaincontroller" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerForceIntegrity:
    title: "2.3.5.5 | Ensure 'Domain controller: LDAP server signing requirements Enforcement' is set to 'Enabled' (DC only) | LDAPServerForceIntegrity"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.3.5.5
    {{ end }}
  {{ end }}
{{ end }}
