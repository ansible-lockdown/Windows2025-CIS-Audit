---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_11_7 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LMCompatibilityLevel:
    title: "2.3.11.7 | Ensure 'Network security: LAN Manager authentication level' is set to 'Send NTLMv2 response only. Refuse LM & NTLM' | LMCompatibilityLevel"
    exists: true
    value: 5
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.11.7
  {{ end }}
{{ end }}
