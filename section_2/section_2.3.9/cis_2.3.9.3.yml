---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_9_3 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\EnableSecuritySignature:
    title: "2.3.9.3 | Ensure 'Microsoft network server: Digitally sign communications (if client agrees)' is set to 'Enabled' | EnableSecuritySignature"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.9.3
  {{ end }}
{{ end }}
