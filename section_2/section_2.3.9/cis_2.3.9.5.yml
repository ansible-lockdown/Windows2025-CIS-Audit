---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_9_5 }}
    {{ if ne .Vars.win25cis_system_role "standalone" }}
      {{ if eq .Vars.win25cis_system_role "memberserver" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMBServerNameHardeningLevel:
    title: "2.3.9.5 | Ensure 'Microsoft network server: Server SPN target name validation level' is set to 'Accept if provided by client' or higher (MS only) | SMBServerNameHardeningLevel"
    exists: true
    value: {{ .Vars.win25cis_smb_server_name_hardening_level }}
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.9.5
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
