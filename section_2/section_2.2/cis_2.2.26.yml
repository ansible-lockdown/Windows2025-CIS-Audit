---

{{ if and (eq .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_2_26 }}
    {{ if not .Vars.win25cis_win_skip_for_test }}
      {{ if eq .Vars.win25cis_system_role "domaincontroller" }}
file:
  win25cis_2_2_26_sedenyremoteinteractivelogonright:
    title: "2.2.26 | Ensure 'Deny log on through Remote Desktop Services' to include 'Guests' (DC only) | SeDenyRemoteInteractiveLogonRight"
    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeDenyRemoteInteractiveLogonRight'
    exists: true
    contents:
      - '/^(.*,)?S-1-5-32-546(,.*)?$/'
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.2.26
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
