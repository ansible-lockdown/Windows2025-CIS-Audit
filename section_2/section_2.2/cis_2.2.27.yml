---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_2_27 }}
    {{ if not .Vars.win25cis_win_skip_for_test }}
      {{ if eq .Vars.win25cis_system_role "memberserver" }}
file:
  win25cis_2_2_27_sedenyremoteinteractivelogonright:
    title: "2.2.27 | Ensure 'Deny log on through Remote Desktop Services' is set to 'Guests, Local account' (MS only) | SeDenyRemoteInteractiveLogonRight"
    path: '{{ .Vars.win25cis_snapshot_dir }}\PrivilegeRights.SeDenyRemoteInteractiveLogonRight'
    exists: true
    contents:
      - '/^S-1-5-113,S-1-5-32-546$/'
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.2.27
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
