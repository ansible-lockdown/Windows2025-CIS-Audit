---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_2_3_6_3 }}
    {{ if ne .Vars.win25cis_system_role "domaincontroller" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SignSecureChannel:
    title: "2.3.6.3 | Ensure 'Domain member: Digitally sign secure channel data (when possible)' is set to 'Enabled' | SignSecureChannel"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.6.3
    {{ end }}
  {{ end }}
{{ end }}
