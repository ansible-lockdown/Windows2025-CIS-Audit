---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_9_25_3 }}
    {{ if eq .Vars.win25cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\ADPasswordEncryptionEnabled:
    title: "18.9.25.3 | Ensure 'Enable password encryption' is set to 'Enabled' | ADPasswordEncryptionEnabled"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.25.3
    {{ end }}
  {{ end }}
{{ end }}
