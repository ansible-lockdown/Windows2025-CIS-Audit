---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_18_9_30_1_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Netlogon\Parameters\BlockNetbiosDiscovery:
    title: "18.9.30.1.1 | Ensure 'Block NetBIOS-based discovery for domain controller location' is set to 'Enabled' | BlockNetbiosDiscovery"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.30.1.1
  {{ end }}
{{ end }}
