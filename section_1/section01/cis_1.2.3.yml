---

{{ if and (ne .Vars.win25cis_system_role "domaincontroller") .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_1_2_3 }}
    {{ if eq .Vars.win25cis_system_role "standalone" }}
file:
  win25cis_1_2_3_allowadministratorlockout:
    title: "1.2.3 | Ensure 'Allow Administrator account lockout' is set to 'Enabled' (MS only) | AllowAdministratorLockout"
    path: '{{ .Vars.win25cis_snapshot_dir }}\SystemAccess.AllowAdministratorLockout'
    exists: true
    contents:
      - '/^{{ .Vars.win25cis_allow_admin_account_lockout }}$/'
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 1.2.3
    {{ end }}
  {{ end }}
{{ end }}
