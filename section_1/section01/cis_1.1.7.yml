---

{{ if .Vars.win25cis_level_1 }}
  {{ if .Vars.win25cis_rule_1_1_7 }}
    {{ if eq .Vars.win25cis_system_role "standalone" }}
file:
  win25cis_1_1_7_cleartextpassword:
    title: "1.1.7 | Ensure 'Store passwords using reversible encryption' is set to 'Disabled' | ClearTextPassword"
    path: '{{ .Vars.win25cis_snapshot_dir }}\SystemAccess.ClearTextPassword'
    exists: true
    contents:
      - '/^0$/'
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 1.1.7
    {{ end }}
  {{ end }}
{{ end }}
